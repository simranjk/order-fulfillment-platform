spring.application.name=order-service

server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order_service_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:simranjeetkaur}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info,metrics

# Downstream service URLs
services.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
services.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}